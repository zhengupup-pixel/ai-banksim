name: Bootstrap AI BankSim source
on:
  push:
    paths:
      - ai-banksim-source.tgz
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tar -xzf ai-banksim-source.tgz
          rm ai-banksim-source.tgz
          rm .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish AI BankSim platform"
          git push

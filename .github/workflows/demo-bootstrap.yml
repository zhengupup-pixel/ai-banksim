name: Publish competition demo source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/workflows
          cp -R .github/workflows/. /tmp/workflows/
          tar -xzf ai-banksim-demo-release.tgz
          rm ai-banksim-demo-release.tgz
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -R /tmp/workflows/. .github/workflows/
          rm .github/workflows/demo-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add no-login competition demo mode"
          git push
